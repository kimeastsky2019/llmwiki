<title>AI 거버넌스 컨트롤 타워</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">

<style>
:root{
  --brand:#0090FF; --brand-dark:#0077D6; --brand-tint:#E6F4FE;
  --accent:#00A2C7; --accent-tint:#DEF7F9;
  --ink:#1C2024; --ink-2:#344054; --muted:#667085;
  --line:#E5E7EB; --line-2:#F0F1F4;
  --surface:#F9F9FB; --canvas:#FCFCFD; --white:#FFFFFF;
  --success:#12B76A; --success-ink:#067647; --success-bg:#ECFDF3;
  --warning:#B54708; --warning-bg:#FFFAEB;
  --danger:#D92D20; --danger-bg:#FEF3F2;
  --slm:#6938EF; --slm-bg:#F4F0FF;
  --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
  --shadow:0 8px 24px rgba(15,23,42,.08);
  --card-shadow:0 1px 2px rgba(0,0,0,.05);
  --font:Inter,"Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--canvas)}
body{margin:0; color:var(--ink); background:var(--canvas); font-family:var(--font);
  font-size:14px; line-height:1.45}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(0,144,255,.25); outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.eyebrow{margin:0 0 7px; color:var(--brand); font-size:11px; font-weight:800;
  letter-spacing:.08em; text-transform:uppercase}
.status-dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px;
  background:currentColor}
.pill{display:inline-flex; align-items:center; gap:5px; padding:5px 9px; border-radius:9999px;
  font-size:11px; font-weight:750; white-space:nowrap}
.pill.success{color:var(--success-ink); background:var(--success-bg)}
.pill.warning{color:var(--warning); background:var(--warning-bg)}
.pill.danger{color:var(--danger); background:var(--danger-bg)}
.pill.neutral{color:var(--ink-2); background:#F2F4F7}
.pill.brand{color:var(--brand-dark); background:var(--brand-tint)}
.pill.slm{color:var(--slm); background:var(--slm-bg)}
.button{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px;
  border:1px solid transparent; border-radius:var(--radius-sm); padding:0 13px; font-size:12px;
  font-weight:750; transition:background .16s ease, border-color .16s ease, transform .16s ease}
.button.primary{color:#fff; background:var(--brand)}
.button.primary:hover{background:var(--brand-dark); transform:translateY(-1px)}
.button.secondary{color:var(--ink-2); background:#fff; border-color:#D0D5DD}
.button.secondary:hover{background:#F9FAFB; border-color:#98A2B3}
.button.sm{min-height:30px; padding:0 10px; font-size:11.5px}
.button:disabled{opacity:.45; cursor:not-allowed; transform:none}

/* ── 상단 ─────────────────────────────────────── */
.mockbar{display:flex; align-items:center; gap:10px; padding:7px 42px; background:#111827;
  color:#D0D5DD; font-size:11.5px; font-family:var(--mono)}
.mockbar b{color:#fff}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:24px;
  min-height:72px; padding:0 42px; background:#fff; border-bottom:1px solid var(--line)}
.brand-lockup{display:flex; align-items:center; gap:12px; min-width:230px}
.brand-mark{display:grid; place-items:center; width:32px; height:32px; color:#fff;
  border-radius:10px; background:linear-gradient(145deg,var(--brand),var(--accent));
  font-weight:900; box-shadow:0 6px 14px rgba(0,144,255,.23)}
.brand-name{font-size:14px; font-weight:800; letter-spacing:-.01em}
.brand-sub{font-size:11px; color:var(--muted)}
.top-right{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.role-pick{display:flex; align-items:center; gap:8px; padding:5px 10px; border:1px solid var(--line);
  border-radius:9999px; background:#fff}
.role-pick label{font-size:10.5px; font-weight:800; letter-spacing:.06em; color:var(--muted)}
.role-pick select{border:0; background:none; font-size:12.5px; font-weight:700; color:var(--ink)}
.avatar{display:grid; place-items:center; width:32px; height:32px; border-radius:50%;
  background:var(--brand-tint); color:var(--brand-dark); font-size:11.5px; font-weight:800}

/* ── 셸 ───────────────────────────────────────── */
.workspace{display:grid; grid-template-columns:224px minmax(0,1fr); min-height:calc(100vh - 100px)}
.side-nav{background:#fff; border-right:1px solid var(--line); padding:22px 14px; display:flex;
  flex-direction:column; gap:6px}
.nav-section{margin:14px 0 4px; padding:0 8px; font-size:10px; font-weight:800; letter-spacing:.1em;
  color:#98A2B3}
.nav-link{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
  border:0; background:none; border-radius:var(--radius-sm); padding:9px 10px; text-align:left;
  color:var(--ink-2); font-size:13px; font-weight:600}
.nav-link:hover{background:var(--surface)}
.nav-link.active{background:var(--brand-tint); color:var(--brand-dark); font-weight:750}
.nav-count{font-size:11px; font-weight:800; color:var(--muted)}
.nav-link.active .nav-count{color:var(--brand-dark)}
.side-note{margin-top:auto; padding:13px 14px; border-radius:var(--radius-md);
  background:var(--warning-bg); border:1px solid #FEDF89}
.side-note b{display:block; font-size:11.5px; color:var(--warning); margin-bottom:4px}
.side-note p{margin:0; font-size:11.5px; color:#7A5B06; line-height:1.55}

.content{padding:32px 42px 120px; overflow:hidden}
.content-wrap{max-width:1440px; margin:0 auto; display:flex; flex-direction:column; gap:26px}
.page-header h1{margin:0 0 6px; font-size:24px; font-weight:800; letter-spacing:-.02em}
.page-header .intro{margin:0; max-width:78ch; color:var(--muted); font-size:13.5px}
.page-header .stamp{margin-top:9px; font-family:var(--mono); font-size:11px; color:#98A2B3}
.head-row{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap}

.card{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--card-shadow); padding:18px 20px}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;
  margin-bottom:12px; flex-wrap:wrap}
.card-head h2{margin:0 0 3px; font-size:15px; font-weight:800}
.card-head p{margin:0; font-size:12px; color:var(--muted)}

/* ── KPI ──────────────────────────────────────── */
.kpi-grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px}
.kpi{background:#fff; border:1px solid var(--line); border-radius:var(--radius-md);
  box-shadow:var(--card-shadow); padding:16px 18px}
.kpi .label{font-size:11.5px; color:var(--muted); font-weight:600}
.kpi .score{margin:6px 0 4px; font-size:26px; font-weight:800; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}
.kpi .feedback{font-size:11.5px; color:var(--muted)}
.kpi .feedback.good{color:var(--success-ink)}
.kpi .feedback.warn{color:var(--warning)}

/* ── 프로세스 흐름 ────────────────────────────── */
.process-flow{display:grid; grid-template-columns:1.1fr 28px 1.1fr 28px 1.1fr 28px 1.1fr 28px 1.1fr;
  align-items:stretch; gap:0}
.arrow{display:grid; place-items:center; color:#C7CDD6; font-size:15px}
.process-card{display:flex; flex-direction:column; gap:8px; border:1px solid var(--line);
  border-radius:var(--radius-md); padding:15px 15px 13px; background:#fff; text-align:left;
  min-height:100%}
.process-card .step{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--muted);
  letter-spacing:.06em}
.process-card h3{margin:0; font-size:14.5px; font-weight:800}
.process-card p{margin:0; font-size:11.8px; color:var(--muted); line-height:1.5}
.process-card .card-footer{display:flex; align-items:center; justify-content:space-between;
  gap:8px; margin-top:auto; padding-top:10px; border-top:1px dashed var(--line)}
.owner-badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
  color:var(--ink-2)}
.owner-badge .owner{display:grid; place-items:center; width:22px; height:22px; border-radius:6px;
  background:var(--surface); color:var(--muted); font-size:9.5px; font-weight:800}
.process-card.risk{border-color:#FEDF89; background:#FFFCF5}
.process-card.review{border-color:#FECDCA; background:#FFFBFA}
.process-card.monitor{border-color:#ABEFC6; background:#F6FEF9}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.decision-line{margin-top:16px; padding:13px 16px; border-radius:var(--radius-md);
  background:var(--brand-tint); border:1px solid #B2DDFF}
.decision-line b{color:var(--brand-dark)}
.decision-note{margin:0; font-size:12.5px; color:var(--ink-2)}

/* ── 하단 그리드 ──────────────────────────────── */
.lower-grid{display:grid; grid-template-columns:minmax(0,1.52fr) minmax(320px,.78fr); gap:20px;
  align-items:start}
.task-list{display:flex; flex-direction:column}
.task-row{display:grid; grid-template-columns:92px minmax(0,1fr) 120px 92px; gap:12px;
  align-items:center; padding:13px 4px; border-bottom:1px solid var(--line-2); text-align:left;
  background:none; border-left:0; border-right:0; border-top:0; width:100%}
.task-row:last-child{border-bottom:0}
.task-row:hover{background:var(--surface)}
.task-id{font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--muted)}
.task-name{font-size:13.5px; font-weight:700}
.task-name small{display:block; font-weight:400; font-size:11.5px; color:var(--muted); margin-top:2px}
.task-owner{font-size:11.5px; color:var(--ink-2); font-weight:600}
.sla{font-size:11.5px; font-weight:750; color:var(--ink-2); text-align:right}
.sla.overdue{color:var(--danger)}

.meter{height:8px; border-radius:9999px; background:var(--line-2); overflow:hidden; margin:10px 0 14px}
.meter span{display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--accent))}
.checklist{display:flex; flex-direction:column; gap:9px; margin:0; padding:0; list-style:none}
.check-item{display:grid; grid-template-columns:18px minmax(0,1fr); gap:9px; font-size:12.5px;
  color:var(--ink-2); line-height:1.5}
.check-item .mark{display:grid; place-items:center; width:18px; height:18px; border-radius:50%;
  background:var(--success-bg); color:var(--success-ink); font-size:10px; font-weight:800}
.check-item.pending .mark{background:var(--warning-bg); color:var(--warning)}
.risk-score{font-size:30px; font-weight:800; letter-spacing:-.02em}

/* ── sLLM 흔적 ────────────────────────────────── */
.by{display:inline-flex; align-items:center; gap:4px; padding:1px 7px; border-radius:9999px;
  font-size:10px; font-weight:800; font-family:var(--mono); letter-spacing:.02em; white-space:nowrap}
.by-slm{color:var(--slm); background:var(--slm-bg)}
.by-rule{color:var(--brand-dark); background:var(--brand-tint)}
.by-human{color:var(--ink-2); background:#F2F4F7}
.slm-strip{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; border:1px solid var(--line);
  border-radius:var(--radius-md); overflow:hidden; background:#fff}
.slm-cell{padding:14px 16px; border-right:1px solid var(--line)}
.slm-cell:last-child{border-right:0}
.slm-cell h4{margin:0 0 6px; font-size:12.5px; font-weight:800; display:flex; align-items:center; gap:6px}
.slm-cell ul{margin:0; padding-left:16px; font-size:12px; color:var(--muted); line-height:1.65}

/* ── 게이트 ───────────────────────────────────── */
.gates{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.gate{border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 16px; background:#fff;
  display:flex; flex-direction:column; gap:6px}
.gate.open{border-color:#ABEFC6; background:var(--success-bg)}
.gate.shut{border-color:#FECDCA; background:var(--danger-bg)}
.gate .step{font-family:var(--mono); font-size:10px; font-weight:700; color:var(--muted)}
.gate h4{margin:0; font-size:13.5px; font-weight:800}
.gate p{margin:0; font-size:11.8px; color:var(--ink-2)}

/* ── 표 ───────────────────────────────────────── */
.tbl{width:100%; border-collapse:collapse; font-size:12.8px}
.tbl th,.tbl td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-2);
  vertical-align:middle}
.tbl th{font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--muted); background:var(--surface); white-space:nowrap}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--surface)}
.tbl .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius-md); background:#fff}

/* ── 체크리스트 카드 ──────────────────────────── */
.checks{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:10px}
.check{display:flex; align-items:flex-start; gap:9px; border:1px solid var(--line);
  border-radius:var(--radius-sm); padding:11px 12px; background:#fff; cursor:pointer}
.check.on{border-color:var(--brand); background:var(--brand-tint)}
.check input{margin-top:3px; accent-color:var(--brand)}
.check b{display:block; font-size:12.8px; font-weight:750}
.check small{color:var(--muted); font-size:11px; line-height:1.5}

.ratio{display:flex; align-items:center; gap:8px}
.ratio input[type=range]{width:84px; accent-color:var(--brand)}
.ratio-v{font-family:var(--mono); font-size:11.5px; min-width:36px; text-align:right;
  font-variant-numeric:tabular-nums; font-weight:700}

.doc{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:15px 17px; font-family:var(--mono); font-size:11.5px; line-height:1.85; white-space:pre-wrap;
  color:var(--ink-2); max-height:340px; overflow:auto}
.doc b{color:var(--ink); font-weight:700}

.line{display:flex; flex-direction:column; position:relative}
.line::before{content:""; position:absolute; left:5px; top:16px; bottom:16px; width:1px; background:var(--line)}
.line-step{display:grid; grid-template-columns:16px minmax(0,1fr) auto; gap:12px; padding:9px 0;
  align-items:start}
.line-dot{width:11px; height:11px; border-radius:50%; border:2px solid var(--line); background:#fff;
  margin-top:5px; position:relative; z-index:1}
.line-step.done .line-dot{background:var(--success); border-color:var(--success)}
.line-step.now .line-dot{background:var(--brand); border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-tint)}
.line-name{font-size:13px; font-weight:750}
.line-sub{font-size:11.5px; color:var(--muted); font-family:var(--mono)}

.tl{display:flex; flex-direction:column; position:relative}
.tl::before{content:""; position:absolute; left:69px; top:10px; bottom:10px; width:1px; background:var(--line)}
.tl-row{display:grid; grid-template-columns:62px 16px minmax(0,1fr); gap:12px; padding:8px 0}
.tl-when{font-family:var(--mono); font-size:10.5px; color:var(--muted); text-align:right; padding-top:3px}
.tl-dot{width:9px; height:9px; border-radius:50%; background:var(--brand); margin:8px 0 0 3px;
  position:relative; z-index:1; outline:3px solid #fff}
.tl-what{font-size:12.8px}
.tl-who{font-size:11px; color:var(--muted); font-family:var(--mono)}

.note{border-radius:var(--radius-md); padding:12px 16px; font-size:12.5px; line-height:1.6}
.note.brand{background:var(--brand-tint); border:1px solid #B2DDFF; color:var(--ink-2)}
.note.warn{background:var(--warning-bg); border:1px solid #FEDF89; color:#7A5B06}
.note b{font-weight:800}

.stack{display:flex; flex-direction:column; gap:20px}
.grid-2{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:20px; align-items:start}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.small{font-size:11.5px}

/* ── 챗봇 ─────────────────────────────────────── */
.ask-fab{position:fixed; right:26px; bottom:26px; z-index:40; display:inline-flex; align-items:center;
  gap:9px; padding:12px 18px; border:0; border-radius:9999px; color:#fff; font-size:13px;
  font-weight:800; background:linear-gradient(145deg,var(--brand),var(--accent));
  box-shadow:0 10px 28px rgba(0,144,255,.34)}
.ask-fab:hover{transform:translateY(-1px)}
.ask{position:fixed; right:26px; bottom:26px; z-index:41; width:min(408px,calc(100vw - 32px));
  max-height:min(640px,calc(100vh - 52px)); display:flex; flex-direction:column;
  background:#fff; border:1px solid var(--line); border-radius:var(--radius-lg);
  box-shadow:var(--shadow); overflow:hidden}
.ask-head{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.ask-mark{display:grid; place-items:center; width:30px; height:30px; border-radius:9px; color:#fff;
  background:linear-gradient(145deg,var(--slm),#9B8AFB); font-size:12px; font-weight:900}
.ask-title{flex:1 1 auto; min-width:0}
.ask-title b{display:block; font-size:13px; font-weight:800}
.ask-title span{font-size:11px; color:var(--muted)}
.ask-x{border:0; background:none; color:var(--muted); font-size:18px; line-height:1; padding:4px 6px}
.ask-x:hover{color:var(--ink)}
.ask-ctx{padding:8px 16px; background:var(--surface); border-bottom:1px solid var(--line);
  font-size:11px; color:var(--muted); font-family:var(--mono)}
.ask-log{flex:1 1 auto; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.msg{max-width:92%; font-size:12.8px; line-height:1.65}
.msg.me{align-self:flex-end; background:var(--brand); color:#fff; padding:9px 13px;
  border-radius:14px 14px 4px 14px}
.msg.bot{align-self:flex-start; background:var(--surface); border:1px solid var(--line);
  padding:11px 13px; border-radius:14px 14px 14px 4px; color:var(--ink-2); white-space:pre-wrap}
.msg.bot b{color:var(--ink); font-weight:750}
.msg-src{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:11px;
  color:var(--muted); font-family:var(--mono); white-space:normal}
.ask-chips{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px}
.ask-chip{border:1px solid var(--line); background:#fff; border-radius:9999px; padding:5px 11px;
  font-size:11.5px; font-weight:600; color:var(--ink-2)}
.ask-chip:hover{border-color:var(--brand); color:var(--brand-dark); background:var(--brand-tint)}
.ask-form{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); background:#fff}
.ask-form input{flex:1 1 auto; min-width:0; border:1px solid var(--line); border-radius:9999px;
  padding:9px 14px; font-size:12.8px}
.ask-form input:focus{border-color:var(--brand); outline:none}
.ask-send{border:0; border-radius:50%; width:38px; height:38px; color:#fff; background:var(--brand);
  font-size:14px; font-weight:800}
.ask-foot{padding:8px 16px 12px; font-size:10.5px; color:var(--muted); font-family:var(--mono);
  background:#fff; text-align:center}
.hidden{display:none!important}

@media (max-width:1200px){
  .process-flow{grid-template-columns:repeat(5,minmax(152px,1fr)); gap:12px; overflow-x:auto; padding-bottom:8px}
  .arrow{display:none}
  .slm-strip{grid-template-columns:1fr}
  .slm-cell{border-right:0; border-bottom:1px solid var(--line)}
}
@media (max-width:1024px){
  .workspace{grid-template-columns:1fr}
  .side-nav{flex-direction:row; flex-wrap:wrap; align-items:center; border-right:0;
    border-bottom:1px solid var(--line)}
  .nav-section,.side-note{display:none}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lower-grid,.gates{grid-template-columns:1fr}
  .content{padding:26px 22px 110px}
  .topbar,.mockbar{padding-left:22px; padding-right:22px}
}
@media (max-width:640px){
  .kpi-grid{grid-template-columns:1fr}
  .task-row{grid-template-columns:76px minmax(0,1fr) 76px}
  .task-owner{display:none}
}
</style>

<div class="mockbar">
  <b>MOCKUP</b> · 화면 설계 확인용 · 데이터는 예시입니다 · 우측 상단에서 역할을 바꾸면 메뉴와 권한이 달라집니다
</div>

<header class="topbar">
  <div class="brand-lockup">
    <span class="brand-mark">AI</span>
    <span>

  /* ═════════════════════════════════════════════════════════════════════
     체크리스트 · 위험표 · 자동 문서 */
  function renderChecks(){
    const host = document.getElementById("checks");
    if (!host) return;
    host.innerHTML = "";
    CHECKS.forEach(c => {
      const on = !!state.checks[c.key];
      const node = el(`<label class="check ${on ? "on" : ""}"><input type="checkbox" ${on ? "checked" : ""}>
        <span><b>${esc(c.t)}</b><small>${esc(c.s)}</small></span></label>`);
      node.querySelector("input").addEventListener("change", e => {
        state.checks[c.key] = e.target.checked;
        renderChecks(); renderRisk(); renderDoc();
      });
      host.appendChild(node);
    });
  }

  function renderRisk(){
    const body = document.getElementById("riskRows");
    if (!body) return;
    const s = score(), p = project(), g = gradeKey(s.left, p.impact);
    body.innerHTML = "";
    s.hit.forEach(i => {
      const r = state.ratio[i.no] ?? 100;
      const left = Math.round(i.pts * (1 - r / 100) * 10) / 10;
      const row = el(`<tr>
        <td class="muted">${esc(i.lv1)}</td>
        <td><b>${esc(i.t)}</b><div class="mono small muted">${esc(i.ref)}</div></td>
        <td class="num mono">${i.pts}</td>
        <td class="muted">${esc(i.mit)}</td>
        <td><span class="ratio"><input type="range" min="0" max="100" step="10" value="${r}"
            aria-label="${esc(i.t)} 경감비율"><span class="ratio-v">${r}%</span>
            ${state.edited[i.no] ? '<span class="by by-human">수정</span>' : ""}</span></td>
        <td class="num mono">${left}</td></tr>`);
      row.querySelector("input").addEventListener("input", e => {
        state.ratio[i.no] = Number(e.target.value);
        state.edited[i.no] = Number(e.target.value) !== 100;
        renderRisk(); renderDoc();
      });
      body.appendChild(row);
    });
    const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v; };
    set("tHit", s.hit.length); set("tRaw", s.raw); set("tLeft", s.left);
    set("tGrade", GRADE[g].label);
    set("tGradeWhy", p.impact && s.left < 9 ? "고영향으로 상향" : `잔여위험 ${s.left} 구간`);
  }

  function renderDoc(){
    const host = document.getElementById("evdoc");
    if (!host) return;
    const p = project(), s = score(), g = gradeKey(s.left, p.impact);
    host.innerHTML =
`<b>AI 위험등급평가서</b>

문서번호    ${p.id}-RA-02
대상 서비스  ${esc(p.name)} (${esc(p.id)} · ${esc(p.sr)})
작성자      ${esc(p.owner)}      작성일  2026-09-05

<b>1. AI 유형 (체크리스트)</b>
${CHECKS.filter(c => state.checks[c.key]).map(c => "  · " + c.t).join("\n") || "  · 해당 없음"}

<b>2. 자동 식별된 위험항목 ${s.hit.length}건 · 인식 위험점수 ${s.raw}</b>
${s.hit.map(i => `  [${String(i.no).padStart(2, "0")}] ${i.t} (${i.pts}점)
       경감방안  ${i.mit}
       경감비율  ${state.ratio[i.no] ?? 100}%${state.edited[i.no] ? "  ※ 수기 조정" : ""}`).join("\n")}

<b>3. 잔여위험 점수 ${s.left} → 산정 등급 ${GRADE[g].label}</b>
${p.impact ? "  ※ 기본법상 고영향 AI 에 해당하여 고위험으로 상향\n" : ""}
<b>4. 승인</b>
  위험관리계획 승인   ${GRADE[g].line[0]}
  이행 검증          ${GRADE[g].verify}
  위험관리 승인       ${GRADE[g].line[0]}

※ 문안 초안은 사내 sLLM 이 작성하고 담당자가 확정합니다.
※ 승인 시 해시와 함께 고정되어 수정할 수 없습니다.`;
  }

  /* ═════════════════════════════════════════════════════════════════════
     거버넌스 도우미 — 화면과 데이터를 함께 보고 답한다.
     근거를 함께 내는 것이 핵심이다. 근거 없이 답하면 그 답은 쓸 수 없다. */
  const CHIPS = [
    "이 프로젝트가 왜 고위험인가요?",
    "승인은 누가 하나요?",
    "지금 PMO 를 왜 못 닫나요?",
    "개인정보 관련 항목은 뭐가 잡혔나요?",
    "위험점수는 어떻게 계산되나요?",
    "sLLM 은 무엇을 하나요?",
  ];

  function answer(q){
    const t = q.replace(/\s/g, "");
    const p = project(), s = score(), g = gradeKey(s.left, p.impact);
    const has = (...ws) => ws.some(w => t.includes(w));

    if (has("고위험", "왜", "등급", "몇등급"))
      return {a:`<b>${esc(p.name)}</b> 은 현재 <b>${GRADE[g].label}</b> 입니다.\n\n`
        + `인식 위험점수 ${s.raw} 에서 경감비율을 반영하면 잔여위험 ${s.left} 입니다. `
        + (p.impact
          ? "여기에 더해 기본법상 <b>고영향 AI</b> 로 판단됐기 때문에, 점수 구간과 무관하게 고위험으로 올라갑니다. 등급을 내리지는 않습니다."
          : `잔여위험 ${s.left} 는 ${s.left >= 9 ? "9 이상" : s.left >= 5 ? "5~8" : "0~4"} 구간이라 ${GRADE[g].label} 입니다.`)
        + `\n\n가장 크게 남은 위험은 ${s.hit.filter(i => (state.ratio[i.no] ?? 100) < 100)
            .sort((a, b) => b.pts * (1 - state.ratio[b.no] / 100) - a.pts * (1 - state.ratio[a.no] / 100))
            .slice(0, 2).map(i => `[${i.no}] ${i.t}`).join(", ") || "없습니다"} 입니다.`,
        src:"근거 · 위험평가항목 배점표 v1.0 / AI 기본법 고영향 AI 판단 기준"};

    if (has("승인", "결재", "누가", "승인권자"))
      return {a:`${GRADE[g].label} 이므로 <b>위험관리계획 승인</b>과 <b>위험관리 승인</b> 모두 `
        + `<b>${GRADE[g].line[0]}</b> 가 맡습니다. 이행 검증은 <b>${GRADE[g].verify}</b> 입니다.\n\n`
        + "승인요청자와 승인자는 동일인이 될 수 없습니다. 상신한 사람에게는 그 건의 승인 버튼이 나오지 않습니다.",
        src:"근거 · 금융 AI 가이드라인 위험등급별 통제절차 / RFP 바.A 역할 분리"};

    if (has("PMO", "종료", "게이트", "차단", "접수", "막"))
      return {a:`게이트 상태는 ① ${p.gates[0] ? "허용" : "차단"} · ② ${p.gates[1] ? "허용" : "차단"} · `
        + `③ ${p.gates[2] ? "허용" : "차단"} 입니다.\n\n`
        + (!p.gates[2]
          ? "<b>PMO 종료가 막혀 있습니다.</b> 위험경감방안 이행 검증 결과가 아직 승인되지 않았습니다. "
            + "제3자 검증기관이 검증결과서를 등록하고 윤리위원회가 위험관리 승인을 의결해야 게이트 ③ 이 열립니다."
          : "세 게이트가 모두 열려 있어 PMO 종료가 가능합니다.")
        + (!p.gates[1] ? "\n\n게이트 ② 도 닫혀 있어 <b>IT 접수 자체가 불가</b>합니다." : ""),
        src:"근거 · RFP 나.B(IT 접수 조건) · 나.C(PMO 종료 조건)"};

    if (has("개인정보", "PII", "민감", "프라이버시")) {
      const rows = s.hit.filter(i => ["privacy"].some(k => i.on.includes(k)) || i.no === 10);
      return {a:"개인정보 관련으로 잡힌 항목입니다.\n\n"
        + rows.map(i => `<b>[${i.no}] ${i.t}</b> (${i.pts}점, 경감 ${state.ratio[i.no] ?? 100}%)\n`
            + `    경감방안 · ${i.mit}\n    근거 · ${i.ref}`).join("\n\n"),
        src:"근거 · 개인정보보호법 제15조·제17조·제23조 / AI RMF MEASURE 2.10"};
    }

    if (has("점수", "계산", "산식", "잔여위험", "어떻게"))
      return {a:"두 단계로 계산합니다.\n\n"
        + "<b>1. 인식 위험점수</b> = 자동 식별된 항목의 배점 합\n"
        + `    현재 ${s.hit.length}건, 합계 ${s.raw} 점\n\n`
        + "<b>2. 잔여위험 점수</b> = Σ 배점 × (1 − 경감비율)\n"
        + `    현재 ${s.left} 점\n\n`
        + "경감비율은 100% 로 사전 적용되고 담당자가 내립니다. "
        + "등급 구간은 0~4 저위험, 5~8 중위험, 9 이상 고위험이며, 고영향이면 무조건 고위험으로 올립니다.\n\n"
        + "이 계산에는 모델이 개입하지 않습니다. 같은 입력이면 언제 눌러도 같은 답이 나옵니다.",
        src:"근거 · RFP 가.C.i 위험점수 관리 / 가.C.ii 잔여위험비율"};

    if (has("sLLM", "슬름", "모델", "AI가", "자동화", "무엇을"))
      return {a:"<b>사내 sLLM 이 맡는 것</b>\n"
        + "  · 체크리스트·기안문에서 초안 뽑기\n  · 산출물 15종 문안 자동 작성\n"
        + "  · 규정 질의응답(지금 이 답변)\n  · 모니터링 보고서 요약\n\n"
        + "<b>맡기지 않는 것</b>\n"
        + "  · 위험점수·등급 산정 → 룰 엔진\n  · 임계치 초과 판정 → 룰 엔진\n"
        + "  · 승인과 확정 → 사람\n\n"
        + "모델은 Qwen3-30B-A3B 이고 사내 GPU(A30) 위에서만 돕니다. 외부 전송은 0 건입니다.",
        src:"gpu-server 210.206.73.80 · Ollama · 이번 주 218건 처리, 외부 전송 0"};

    if (has("임계치", "초과", "모니터링", "지표"))
      return {a:"임계치를 넘은 지표는 <b>오탐 민원 7건</b> (기준 5건) 하나입니다.\n\n"
        + "승인율 격차는 4.1%p 로 기준(5.0%p) 안이지만 관찰 대상이고, 드리프트 PSI 0.11 과 "
        + "설명 요청 응답률 98% 는 정상입니다.\n\n"
        + "초과 지표가 있으므로 변경·사고·민원에 따른 <b>위험평가 재실시</b> 대상입니다.",
        src:"근거 · 금융소비자보호법 제19조 / RFP 카.B 임계치 모니터링"};

    if (has("산출물", "문서", "서식", "몇종"))
      return {a:"라이프사이클 단계별 15종입니다. 현재 상태는\n\n"
        + `  승인 완료 ${DOCS.filter(d => d.st === "approved").length}건\n`
        + `  sLLM 초안 작성 ${DOCS.filter(d => d.st === "slm").length}건\n`
        + `  작성 중 ${DOCS.filter(d => d.st === "draft").length}건\n`
        + `  제3자 등록 대기 ${DOCS.filter(d => d.st === "wait").length}건\n`
        + `  운영 단계 대기 ${DOCS.filter(d => d.st === "pending").length}건\n\n`
        + "초안은 sLLM 이 쓰고 사람이 확정합니다. 승인된 문서는 수정할 수 없고 대체본만 만듭니다.",
        src:"근거 · RFP 가.D 라이프사이클 단계별 증적 생성 및 관리 자동화"};

    if (has("병목", "어디", "지금", "포커스"))
      return {a:"지금 막혀 있는 곳은 <b>게이트 ③(PMO 종료)</b> 입니다.\n\n"
        + "고위험 2건이 제3자 검증 결과 등록을 기다리고 있고, 그중 AGR-2409 는 SLA 가 2시간 남았습니다.\n\n"
        + "그 앞 단계에서는 AGR-2412 가 위험관리계획 승인 대기라 <b>IT 접수가 열리지 않은</b> 상태입니다.",
        src:"근거 · 업무 큐 4건 · 게이트 상태 집계"};

    return {a:"그 질문은 아직 제가 근거를 대며 답할 수 없습니다.\n\n지금 답할 수 있는 것은 이런 것들입니다.\n\n"
      + "  · 이 프로젝트의 등급과 그 근거\n  · 단계별 승인권자와 역할 분리 규칙\n"
      + "  · 게이트가 왜 막혀 있는지\n  · 위험항목·경감방안·근거 법규\n"
      + "  · 위험점수와 잔여위험 계산식\n  · 모니터링 지표와 임계치\n  · 산출물 현황\n\n"
      + "근거를 못 대는 답은 드리지 않습니다.",
      src:"답변 범위 · 현재 프로젝트 데이터와 사규·법규 인덱스"};
  }

  function push(who, html, src){
    const log = document.getElementById("askLog");
    log.appendChild(el(who === "me"
      ? `<div class="msg me">${esc(html)}</div>`
      : `<div class="msg bot">${html}${src ? `<div class="msg-src">${esc(src)}</div>` : ""}</div>`));
    log.scrollTop = log.scrollHeight;
  }

  function ask(q){
    if (!q.trim()) return;
    openAsk(true);
    push("me", q);
    const typing = el('<div class="msg bot muted">사내 sLLM 이 답을 짓는 중…</div>');
    document.getElementById("askLog").appendChild(typing);
    setTimeout(() => {
      typing.remove();
      const r = answer(q);
      push("bot", r.a, r.src);
    }, 420);
  }

  function openAsk(on){
    state.askOpen = on;
    document.getElementById("ask").classList.toggle("hidden", !on);
    document.getElementById("askFab").classList.toggle("hidden", on);
    document.getElementById("askFab").setAttribute("aria-expanded", String(on));
    if (on) {
      if (!state.asked) {
        state.asked = true;
        push("bot", "안녕하세요. 지금 보고 계신 화면과 프로젝트를 함께 보고 답합니다.\n"
          + "규정·지표·절차 어느 쪽이든 물어보세요. 답에는 항상 근거를 붙입니다.",
          "사내 sLLM · Qwen3-30B-A3B · 외부 전송 없음");
      }
      setTimeout(() => document.getElementById("askInput").focus(), 40);
    }
  }

  function renderAskCtx(){
    const p = project();
    document.getElementById("askCtx").textContent =
      `보고 있는 화면 · ${MENU[state.view] ? MENU[state.view].label : state.view} · ${p.id} ${p.name} · ${ROLES[state.role].name}`;
  }

  function initAsk(){
    document.getElementById("askFab").addEventListener("click", () => openAsk(true));
    document.getElementById("askX").addEventListener("click", () => openAsk(false));
    document.getElementById("askForm").addEventListener("submit", e => {
      e.preventDefault();
      const inp = document.getElementById("askInput");
      ask(inp.value); inp.value = "";
    });
    const chips = document.getElementById("askChips");
    CHIPS.forEach(c => {
      const b = el(`<button class="ask-chip" type="button">${esc(c)}</button>`);
      b.addEventListener("click", () => ask(c));
      chips.appendChild(b);
    });
  }

  /* ═════════════════════════════════════════════════════════════════════ */
  function render(){
    renderNav();
    const main = document.getElementById("main");
    main.innerHTML = (VIEWS[state.view] || VIEWS.flow)();
    main.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => {
      state.projectId = b.dataset.open; state.view = "project"; render();
    }));
    main.querySelectorAll("[data-nav]").forEach(b => b.addEventListener("click", () => {
      state.view = b.dataset.nav; render();
    }));
    main.querySelectorAll("[data-ask]").forEach(b => b.addEventListener("click", () => ask(b.dataset.ask)));
    renderChecks(); renderRisk(); renderDoc(); renderAskCtx();
  }

  initAsk();
  render();
})();
</script>
