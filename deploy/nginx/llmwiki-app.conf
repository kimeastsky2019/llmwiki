# ──────────────────────────────────────────────────────────────
# llmwiki-app.conf — 옛 /wiki/ 경로를 전용 도메인으로 넘긴다
#
# 배치 위치: /etc/nginx/snippets/llmwiki-app.conf
# rag-ai-gov-app.conf 에서 include 하므로 80·443 양쪽에 함께 적용된다.
#
# 전에는 여기서 앱을 직접 프록시했다. 전용 도메인(llmwiki-site.conf)이 생긴
# 뒤로는 프론트를 base "/" 로 빌드하므로, 이 경로로 앱을 계속 내보내면 자산
# 주소(/assets/...)가 rag-ai-gov 의 정적 루트로 가서 404 가 난다.
# 그래서 앱을 서빙하지 않고 도메인으로 301 시킨다 — 옛 링크는 살려 둔다.
# ──────────────────────────────────────────────────────────────

location = /wiki {
    return 301 http://llmwiki.example.com/;
}

# prefix location 에서는 $1 이 없다 — 뒤에 붙은 경로(/wiki/reg 등)를 살리려면
# 정규식으로 잡아야 한다. 정규식은 prefix 보다 먼저 매칭되므로 순서 걱정도 없다.
location ~ ^/wiki/(.*)$ {
    return 301 http://llmwiki.example.com/$1$is_args$args;
}
