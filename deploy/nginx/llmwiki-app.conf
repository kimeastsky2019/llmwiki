# ──────────────────────────────────────────────────────────────
# llmwiki-app.conf — LLMWiki 뷰어를 /wiki/ 하위에 붙인다
#
# 배치 위치: /etc/nginx/snippets/llmwiki-app.conf
# rag-ai-gov-app.conf 에서 include 하므로 80·443 양쪽에 함께 적용된다.
#
# 프론트는 VITE_BASE=/wiki/ 로 빌드돼 있어 자산을 /wiki/assets/... 로 부른다.
# proxy_pass 끝의 슬래시가 /wiki 접두어를 떼므로 백엔드는 /api/... /assets/...
# 를 그대로 받는다. 접두어를 바꾸려면 프론트도 같은 값으로 다시 빌드해야 한다.
#
# 인증: 뷰어 자체에는 로그인이 없다. 아무나 소스를 올리고 남이 올린 명세서를
# 볼 수 있으므로 nginx basic auth 로 막는다. 사용자 추가·변경은
#   sudo openssl passwd -apr1        (해시 출력)
#   sudo vi /etc/nginx/.llmwiki-htpasswd   (사용자:해시 한 줄씩)
#   sudo systemctl reload nginx
# ──────────────────────────────────────────────────────────────

# 슬래시 없이 들어오면 SPA 폴백(/index.html)으로 새 버려 자산 경로가 깨진다.
location = /wiki {
    return 301 /wiki/;
}

# 업로드 전용 — 폴더를 통째로 올릴 때 브라우저가 파일 수백 개를 디스크에서
# 읽어 multipart 본문을 만드는 동안 첫 바이트가 늦게 온다. 기본
# client_body_timeout(60s) 이면 그 사이에 nginx 가 408 로 끊는다.
location = /wiki/api/projects/upload {
    proxy_pass http://127.0.0.1:8722/api/projects/upload;

    # auth_basic 은 location 사이에 상속되지 않는다 — 블록마다 다시 적는다.
    # 하나라도 빠뜨리면 그 경로만 무인증으로 열린다.
    auth_basic           "LLMWiki";
    auth_basic_user_file /etc/nginx/.llmwiki-htpasswd;

    client_max_body_size  512M;
    client_body_timeout   300s;
    # 본문을 nginx 가 다 받아서 넘긴다. off 로 두면 백엔드 소비 속도가
    # 그대로 클라이언트 역압이 돼 느린 업로드가 더 잘 끊긴다.
    proxy_request_buffering on;
    client_body_buffer_size 1M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_connect_timeout 60s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;
}

location /wiki/ {
    proxy_pass http://127.0.0.1:8722/;

    # ⚠ 80 포트 평문 서빙 중이라 이 자격증명도 평문으로 오간다. 상위망이 443 을
    #   막고 있어 지금은 이 방법뿐이다. 443 이 열리면 HTTPS 전용으로 돌릴 것.
    auth_basic           "LLMWiki";
    auth_basic_user_file /etc/nginx/.llmwiki-htpasswd;

    # 소스 폴더 통째 업로드. 서버측 상한(500MB)보다 약간 크게 둬서,
    # 한도 초과 시 nginx 의 413 이 아니라 앱이 사유를 담아 응답하게 한다.
    client_max_body_size 512M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # 소스 파싱과 LLM 명세서 생성은 수 분이 걸린다.
    # (프로그램 수십 개 × Grok 호출 — 기본 60초면 중간에 끊긴다)
    proxy_connect_timeout 60s;
    proxy_send_timeout    900s;
    proxy_read_timeout    900s;

    proxy_buffering off;
    proxy_request_buffering off;
}
