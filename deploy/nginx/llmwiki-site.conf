# ──────────────────────────────────────────────────────────────
# llmwiki-site.conf — llmwiki.example.com 전용 서버 블록
#
# ⚠ server_name 과 리다이렉트 대상의 llmwiki.example.com 은 자리표시자다.
#   공개 저장소라 실제 호스트를 적지 않는다 — 배포할 때 바꿔 넣을 것.
#
# 배치 위치: /etc/nginx/sites-available/llmwiki.conf
#            + /etc/nginx/sites-enabled/llmwiki.conf 심볼릭 링크
#
# default_server 를 붙이지 않는다. 그래야 Host 가 정확히 이 이름일 때만 여기로
# 오고, IP 로 들어온 요청은 종전대로 rag-ai-gov 가 받는다.
#
# 이 블록이 생기면서 프론트는 base "/" 로 빌드한다. IP 의 /wiki/ 경로는
# llmwiki-app.conf 에서 이 도메인으로 301 시킨다 — 옛 링크가 죽지 않도록.
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name llmwiki.example.com;

    access_log /var/log/nginx/llmwiki.access.log;
    error_log  /var/log/nginx/llmwiki.error.log;

    # certbot 도메인 검증 경로 (평문 필수, 인증 제외)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    # 업로드 전용 — 폴더를 통째로 올릴 때 브라우저가 파일 수백 개를 디스크에서
    # 읽어 multipart 본문을 만드는 동안 첫 바이트가 늦게 온다. 기본
    # client_body_timeout(60s) 이면 그 사이에 nginx 가 408 로 끊는다.
    location = /api/projects/upload {
        proxy_pass http://127.0.0.1:8722/api/projects/upload;

        # auth_basic 은 location 사이에 상속되지 않는다 — 블록마다 다시 적는다.
        # 하나라도 빠뜨리면 그 경로만 무인증으로 열린다.
        auth_basic           "LLMWiki";
        auth_basic_user_file /etc/nginx/.llmwiki-htpasswd;

        client_max_body_size  512M;
        client_body_timeout   300s;
        # 본문을 nginx 가 다 받아서 넘긴다. off 로 두면 백엔드 소비 속도가
        # 그대로 클라이언트 역압이 돼 느린 업로드가 더 잘 끊긴다.
        proxy_request_buffering on;
        client_body_buffer_size 1M;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8722;

        # ⚠ 80 포트 평문 서빙 중이라 이 자격증명도 평문으로 오간다. 상위망이
        #   443 을 막고 있어 지금은 이 방법뿐이다. 443 이 열리면 HTTPS 전용으로
        #   돌리고 이 주석을 지울 것.
        auth_basic           "LLMWiki";
        auth_basic_user_file /etc/nginx/.llmwiki-htpasswd;

        client_max_body_size 512M;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 소스 파싱과 LLM 명세서 생성은 수 분이 걸린다.
        # (프로그램 수십 개 × Grok 호출 — 기본 60초면 중간에 끊긴다)
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
