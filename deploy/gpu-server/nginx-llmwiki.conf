# ──────────────────────────────────────────────────────────────
# gpu-server 전용 — 이 서버에는 다른 서비스가 없으므로 IP 루트에서 서빙한다.
# 배치: /etc/nginx/sites-available/llmwiki.conf (+ sites-enabled 링크)
#
# ⚠ 앱에 인증이 없다. 공인 IP 에 그대로 열면 소스와 판정 이력이 공개된다.
#   basic auth 가 유일한 방어선이므로 절대 빼지 말 것.
#   80 평문이라 자격증명도 평문으로 오간다 — 443 이 열리면 HTTPS 전용으로 돌린다.
# ──────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/llmwiki.access.log;
    error_log  /var/log/nginx/llmwiki.error.log;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        auth_basic off;
    }

    # 폴더 통째 업로드는 첫 바이트가 늦게 온다. 기본 60초면 nginx 가 408 로 끊는다.
    location = /api/projects/upload {
        proxy_pass http://127.0.0.1:8722/api/projects/upload;

        # auth_basic 은 location 사이에 상속되지 않는다 — 블록마다 다시 적는다.
        auth_basic           "LLMWiki";
        auth_basic_user_file /etc/nginx/.llmwiki-htpasswd;

        client_max_body_size  512M;
        client_body_timeout   300s;
        proxy_request_buffering on;
        client_body_buffer_size 1M;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8722;

        auth_basic           "LLMWiki";
        auth_basic_user_file /etc/nginx/.llmwiki-htpasswd;

        client_max_body_size 512M;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 사내 sLLM 한 번 호출이 수십 초~수 분이다. 기본값이면 중간에 끊긴다.
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;

        proxy_buffering off;
        proxy_request_buffering off;
    }
}
