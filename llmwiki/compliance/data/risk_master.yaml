# 규제준수 자동평가 — 배점·판정 기준 마스터
#
# 출처: 금융분야 AI 위험관리 프레임워크(RMF) 본문(의견수렴용), 2026.1., 금융감독원
#       별첨04. AI 위험등급평가서 v1.0 (20260225)
#       AI거버넌스규정 (20260226)
#
# ★ 이 파일이 배점의 단일 원본이다. 코드에 숫자를 박지 않는다 —
#   32항목 100점은 컨설팅 창작이 아니라 RMF 16개 평가항목 배점을 Lv3 로 쪼갠
#   것이라, 임의로 바꾸면 규제 근거를 잃는다.
version: "1.0"
standard:
  rmf: "금융분야 AI 위험관리 프레임워크(RMF) 본문(의견수렴용) 2026.1. 금융감독원"
  worksheet: "별첨04. AI 위험등급평가서 v1.0 (20260225)"
  regulation: "AI거버넌스규정 (20260226)"

# --------------------------------------------------------------------------- #
# STEP 1 — 고영향 판단
#
# ★ 배점은 판정에 쓰지 않는다. A 가 B 보다 무겁다는 표시일 뿐이고,
#   판정은 아래 rule 의 조합 규칙이다. 합산해서 임계값과 비교하면 틀린다.
# --------------------------------------------------------------------------- #
high_impact:
  rule: "(A>=2) OR (A==1 AND B>=2)"
  source: "별첨04 「1. 영향&안전성 여부 판단서」 하단 주석 / 규정 붙임1"
  groups:
    A:
      - id: A1
        text: "기존 모델보다 파라미터 증가, 학습 데이터 양 또는 유형의 확대 등으로 복잡도가 증가한 신규 모델에 기반한 AI시스템"
        weight_note: 2
      - id: A2
        text: "1만명 이상의 금융소비자를 대상으로 하는 AI시스템"
        weight_note: 2
      - id: A3
        text: "자동화 정도가 높고 속도가 빨라서 실질적으로 최종 의사결정에 관한 사람의 개입이 불가능한 AI시스템"
        weight_note: 2
    B:
      - id: B1
        text: "대리 변수(Proxy Variable)를 활용하는 빈도가 높은 AI시스템"
        weight_note: 1
      - id: B2
        text: "특정 업무영역을 위해 개발·고도화된 AI시스템을 다른 업무영역에 일시적 또는 단기간 활용하는 경우"
        weight_note: 1
      - id: B3
        text: "국외 데이터를 주로 학습하여 개발된 국외 AI시스템을 활용하는 경우"
        weight_note: 1

# --------------------------------------------------------------------------- #
# STEP 1 — 안전성 대상 판단 (고영향 = Yes 일 때만 수행)
# ★ AND 조건이다. OR 로 구현하면 결함.
# --------------------------------------------------------------------------- #
safety:
  rule: "S1 AND S2 AND S3"
  only_when_high_impact: true
  source: "규정 「안전성 확보 적용대상」 — 하기 기준을 모두 충족한 AI 시스템"
  stages: ["기획·설계 단계 사전 판단", "개발 단계 최종 판단"]
  items:
    - id: S1
      text: "학습에 사용된 누적 연산량이 10^26 부동소수점연산(FLOPs) 이상인가"
    - id: S2
      text: "AI 발전 수준을 고려할 때 최첨단 AI기술을 적용하여 구성·운영되고 있는가"
    - id: S3
      text: "사람의 생명·신체·기본권에 광범위하고 중대한 영향을 미칠 우려가 있는가"

# --------------------------------------------------------------------------- #
# STEP 2 — 서비스 프로파일 4축
#
# ★ 4축 → 32항목 매핑 규칙은 별첨04 수식 안에 있어 원본에서 확정하지 못했다.
#   그래서 여기에 매핑을 넣지 않는다. 추측으로 채우면 근거 없는 필터가 된다.
#   화면에서는 '작성 안내'로만 쓰고, 점수는 전 항목을 대상으로 계산한다
#   (별첨04 실제 동작 — 평가세트 제외 항목도 식별 Yes 면 합산된다).
# --------------------------------------------------------------------------- #
profile_axes:
  - key: user_scope
    label: "1-1 사용자 범위"
    options: ["대고객 서비스", "임직원 서비스"]
  - key: output_kind
    label: "1-2 산출물 특성"
    options: ["생성형", "판단형", "복합형(생성형+판단형)"]
  - key: decision_impact
    label: "1-3 의사결정 영향도"
    options: ["인간결정형(HITL)", "인간감독형(HOTL)", "자율운영형(HOVL)"]
  - key: data_sensitivity
    label: "1-4 데이터 민감도"
    options: ["비개인정보", "개인정보", "민감·신용정보"]

evaluation_set:
  mapping_defined: false
  note: "4축 → 평가대상 항목 매핑은 원본 미확정(§7-C). 평가세트는 작성 안내이며 점수 필터가 아니다."

# --------------------------------------------------------------------------- #
# STEP 4 — 완화 가중치
# ★ 완화방안 미적용(No)이면 1.0 이다. 0 으로 처리하면 중대 결함.
# --------------------------------------------------------------------------- #
mitigation_weights:
  - code: "○"
    key: full
    weight: 0.0
    label: "완전히 완화"
  - code: "△"
    key: partial
    weight: 0.5
    label: "완화방안 적용 후에도 잔여위험 존재"
  - code: "X"
    key: none
    weight: 1.0
    label: "완화방안 적용 후에도 위험수준 동일"
not_mitigated_weight: 1.0

# --------------------------------------------------------------------------- #
# STEP 5 — 등급 구간 (하단 포함)
# --------------------------------------------------------------------------- #
grades:
  - key: unacceptable
    label: "허용불가 서비스"
    min: 75
    max: 100
    rank: 4
  - key: high
    label: "고위험 서비스"
    min: 50
    max: 74
    rank: 3
  - key: medium
    label: "중위험 서비스"
    min: 25
    max: 49
    rank: 2
  - key: low
    label: "저위험 서비스"
    min: 0
    max: 24
    rank: 1

# ★ 고영향이면 계산 등급과 무관하게 최소 고위험. 등급을 낮추지는 않는다.
high_impact_override:
  enabled: true
  floor: high
  source: "규정 — 고영향 AI는 위험 점수에 따른 등급 분류와 관계없이 고위험 AI로 자동 분류"

# 반올림: 원본에 규정이 없다. 계산은 반올림하지 않고 그대로 두고,
# 표시할 때만 소수 첫째 자리까지 보여 준다 (0.5 가중치 × 홀수 배점 = 0.5, 1.5).
rounding:
  mode: none
  display_decimals: 1

# --------------------------------------------------------------------------- #
# 32개 항목 마스터 (배점 원본)
# ★ "no" 를 따옴표로 감싼 이유: YAML 1.1 은 맨 no 를 불리언 False 로 읽는다.
# 불변식: 32문항 100점 / 합법성 6·20 / 신뢰성 11·30 / 신의성실 4·20 / 보안성 11·30
# --------------------------------------------------------------------------- #
items:
  - {"no": 1,  lv1: "합법성 원칙", lv2: "금융소비자보호법 위반 가능성", lv3: "고지 의무 위반", points: 4, owner: "AI 서비스기획"}
  - {"no": 2,  lv1: "합법성 원칙", lv2: "금융소비자보호법 위반 가능성", lv3: "설명 의무/부당권유행위 위반", points: 4, owner: "AI 서비스기획"}
  - {"no": 3,  lv1: "합법성 원칙", lv2: "AI기본법 위반 가능성", lv3: "AI 기본법 위반", points: 4, owner: "AI 서비스기획"}
  - {"no": 4,  lv1: "합법성 원칙", lv2: "데이터 관련법 위반 가능성", lv3: "민감 정보 추출/재식별", points: 2, owner: "AI 서비스기획"}
  - {"no": 5,  lv1: "합법성 원칙", lv2: "데이터 관련법 위반 가능성", lv3: "개인정보의 부적절한 처리", points: 2, owner: "AI 서비스기획"}
  - {"no": 6,  lv1: "합법성 원칙", lv2: "개별 업권법 위반 가능성", lv3: "금융관련 법 위반", points: 4, owner: "AI 서비스기획"}
  - {"no": 7,  lv1: "신뢰성 원칙", lv2: "품질", lv3: "데이터 불충분성", points: 2, owner: "AI 개발"}
  - {"no": 8,  lv1: "신뢰성 원칙", lv2: "품질", lv3: "데이터 정확성 부족", points: 2, owner: "AI 개발"}
  - {"no": 9,  lv1: "신뢰성 원칙", lv2: "품질", lv3: "학습 데이터 오염/손실", points: 2, owner: "AI 개발"}
  - {"no": 10, lv1: "신뢰성 원칙", lv2: "편향성", lv3: "데이터 편향성", points: 6, owner: "AI 개발"}
  - {"no": 11, lv1: "신뢰성 원칙", lv2: "공정성", lv3: "공정성 위반", points: 6, owner: "AI 개발"}
  - {"no": 12, lv1: "신뢰성 원칙", lv2: "설명가능성", lv3: "설명 가능성/투명성 부족", points: 6, owner: "AI 서비스기획"}
  - {"no": 13, lv1: "신뢰성 원칙", lv2: "성능", lv3: "모델 과대/과소 적합 위험", points: 1, owner: "AI 개발"}
  - {"no": 14, lv1: "신뢰성 원칙", lv2: "성능", lv3: "모델 드리프트 위험", points: 1, owner: "AI 개발"}
  - {"no": 15, lv1: "신뢰성 원칙", lv2: "성능", lv3: "모델 붕괴 (Model Collapse)", points: 1, owner: "AI 개발"}
  - {"no": 16, lv1: "신뢰성 원칙", lv2: "성능", lv3: "모델 성능 지표 부적합", points: 1, owner: "AI 서비스기획"}
