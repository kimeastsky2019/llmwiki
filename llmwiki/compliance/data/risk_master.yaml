  - {"no": 27, lv1: "보안성 원칙", lv2: "안정성", lv3: "시스템 안정성", points: 8, owner: "AI 개발"}
  - {"no": 28, lv1: "보안성 원칙", lv2: "위탁/관리", lv3: "AI 서비스 외부 위탁", points: 3, owner: "AI 서비스기획"}
  - {"no": 29, lv1: "보안성 원칙", lv2: "위탁/관리", lv3: "모델 외부위탁 위험", points: 3, owner: "AI 서비스기획"}
