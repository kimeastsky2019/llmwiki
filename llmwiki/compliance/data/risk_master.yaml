  - {"no": 23, lv1: "보안성 원칙", lv2: "보안", lv3: "무단 모델 추출 (Model Extraction)", points: 2, owner: "AI 개발"}
  - {"no": 24, lv1: "보안성 원칙", lv2: "보안", lv3: "사이버 범죄 지원", points: 2, owner: "AI 서비스기획"}
