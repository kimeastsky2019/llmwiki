# 코드 근거 제안 패턴 — 정적 분석 사실을 위험평가 입력의 **후보**로 옮길 때 쓰는 규칙.
#
# ★ 여기 있는 것은 전부 '신호'다. '판정'이 아니다.
#   코드가 TB_CUST 를 읽는다는 사실은 "개인정보를 처리한다" 는 신호지
#   "개인정보를 부적절하게 처리한다" 는 판정이 아니다. 화면은 체크박스를
#   미리 켜지 않고 근거와 함께 제안만 하며, Yes/No 는 사람이 누른다.
#
# 패턴은 대소문자를 구분하지 않는 부분일치다. 현장마다 명명규칙이 다르므로
# 코드가 아니라 이 파일을 고쳐서 맞춘다.
version: "1.0.0"

# --------------------------------------------------------------------------- #
# 프로파일 1-1 사용자 범위 — 계층과 URL 패턴
# --------------------------------------------------------------------------- #
user_scope:
  - value: "대고객 서비스"
    layers: ["채널", "channel", "front", "대고객"]
    urls: ["/cust", "/customer", "/web", "/mobile", "/app", "/user", "/personal"]
  - value: "임직원 서비스"
    layers: ["기관", "inst", "back", "내부", "admin"]
    urls: ["/admin", "/mng", "/manage", "/emp", "/staff", "/internal", "/back", "/oper"]

# --------------------------------------------------------------------------- #
# 프로파일 1-4 데이터 민감도 — 접근 테이블 이름
# 위에서부터 먼저 걸리는 것을 쓴다 (민감·신용 > 개인정보 > 비개인정보)
# --------------------------------------------------------------------------- #
data_sensitivity:
  - value: "민감·신용정보"
    tables: ["CREDIT", "CRDT", "CB_", "SCORE", "SCR_", "RRN", "JUMIN", "SSN",
             "BIO", "HEALTH", "MEDI", "신용", "민감"]
  - value: "개인정보"
    tables: ["CUST", "CUSTOMER", "MEMBER", "MBR", "USER", "USR", "PERSON",
             "PSN", "ADDR", "PHONE", "TEL", "EMAIL", "ACCT_HLDR", "고객", "회원"]
  - value: "비개인정보"
    tables: []          # 위 어느 것에도 걸리지 않으면 여기로 떨어진다

# --------------------------------------------------------------------------- #
# 외부 호출 지점 — 위탁(28·29) 후보 판단에 쓴다
# --------------------------------------------------------------------------- #
external_calls:
  ["RestTemplate", "WebClient", "HttpClient", "HttpURLConnection", "OkHttp",
   "FeignClient", "HttpTemplate", "requests", "urllib", "httpx", "aiohttp",
   "boto3", "openai", "anthropic", "grpc", "SoapClient", "JmsTemplate"]

# 성능·드리프트 측정 코드 — 있으면 14·16 을 제안하지 않고, 없으면 제안한다
metric_markers:
  ["drift", "psi", "ks_", "auc", "roc", "accuracy", "precision", "recall",
   "f1score", "rmse", "mape", "metric", "monitor", "evaluate", "성능", "지표"]

# --------------------------------------------------------------------------- #
# 위험 항목 제안 규칙
#   when: personal_tables | sensitive_tables | write_personal | read_personal
#         | external_calls | no_metrics | customer_facing
# --------------------------------------------------------------------------- #
items:
  - item_no: 4
    when: sensitive_tables
    because: "민감·신용정보로 보이는 테이블에 접근한다 — 추출·재식별 가능성을 살펴야 한다"
  - item_no: 5
    when: personal_tables
    because: "개인정보로 보이는 테이블에 접근한다 — 처리 근거와 범위를 확인해야 한다"
  - item_no: 30
    when: read_personal_customer
    because: "대고객 경로에서 개인정보 테이블을 읽는다 — 화면·응답으로 PII 가 나갈 수 있다"
  - item_no: 32
    when: write_personal
    because: "개인정보 테이블에 쓰기(C/U)가 있다 — 수집 항목이 목적에 필요한 범위인지 확인해야 한다"
  - item_no: 28
    when: external_calls
    because: "외부 시스템 호출 지점이 있다 — 서비스 일부가 외부에 위탁되는지 확인해야 한다"
  - item_no: 29
    when: external_calls
    because: "외부 시스템 호출 지점이 있다 — 모델 추론이 외부에서 도는지 확인해야 한다"
  - item_no: 14
    when: no_metrics
    because: "성능·드리프트를 측정하는 코드가 보이지 않는다 — 드리프트를 감지할 방법이 있는지 확인해야 한다"
  - item_no: 16
    when: no_metrics
    because: "성능 지표를 계산하는 코드가 보이지 않는다 — 지표 적합성을 판단할 근거가 없다"

# 코드가 답할 수 없는 것. 화면에 '불가'로 명시해 과장을 막는다.
unanswerable:
  - key: high_impact
    reason: "고영향(A1~A3·B1~B3)은 업무 성격 판단이라 코드에 없다"
  - key: output_kind
    reason: "산출물 특성(생성형/판단형)은 모델 설계 정보라 정적 분석에 없다"
  - key: decision_impact
    reason: "의사결정 영향도(HITL/HOTL/HOVL)는 운영 절차라 코드에 없다"
